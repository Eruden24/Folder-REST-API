spring.application.name=foldersdemo

spring.datasource.url=jdbc:mysql://localhost:3306/eruden
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Keep database access inside the service layer's transactions, never during JSON rendering
spring.jpa.open-in-view=false
# Store timestamps in UTC regardless of the server's time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Clients cannot request ?size=1000000
spring.data.web.pageable.max-page-size=100
