spring.application.name=foldersdemo

# Local secrets live in .env (ignored by git; copy .env.example to start). 'optional' lets the app
# start without the file, e.g. on a server where DB_USERNAME and DB_PASSWORD are real environment variables.
spring.config.import=optional:file:.env[.properties]

# Database connection. Username and password have no fallback, so they never live in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eruden}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Keep database access inside the service layer's transactions, never during JSON rendering
spring.jpa.open-in-view=false
# Store timestamps in UTC regardless of the server's time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Clients cannot request ?size=1000000
spring.data.web.pageable.max-page-size=100
